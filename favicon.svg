<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#2A1F33"/>
  <g transform="translate(16,16)">
    <!-- Outer rays -->
    <g fill="none" stroke="#C9AD6F" stroke-width="0.8" stroke-linecap="round">
      <line y1="-13" y2="-7"/>
      <line y1="-13" y2="-7" transform="rotate(30)"/>
      <line y1="-13" y2="-7" transform="rotate(60)"/>
      <line y1="-13" y2="-7" transform="rotate(90)"/>
      <line y1="-13" y2="-7" transform="rotate(120)"/>
      <line y1="-13" y2="-7" transform="rotate(150)"/>
      <line y1="-13" y2="-7" transform="rotate(180)"/>
      <line y1="-13" y2="-7" transform="rotate(210)"/>
      <line y1="-13" y2="-7" transform="rotate(240)"/>
      <line y1="-13" y2="-7" transform="rotate(270)"/>
      <line y1="-13" y2="-7" transform="rotate(300)"/>
      <line y1="-13" y2="-7" transform="rotate(330)"/>
    </g>
    <!-- Inner sun circle -->
    <circle r="5.5" fill="none" stroke="#C9AD6F" stroke-width="0.9"/>
    <!-- Center dot -->
    <circle r="1.2" fill="#C9AD6F"/>
  </g>
</svg>
