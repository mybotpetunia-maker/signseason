<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0}
body{
  width:1024px;height:1024px;
  background:#0D0D1A;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
/* subtle ring */
.ring{
  position:absolute;
  width:680px;height:680px;
  border-radius:50%;
  border:1px solid rgba(123,104,238,.15);
}
.ring-2{
  width:780px;height:780px;
  border-color:rgba(123,104,238,.07);
}
/* radial glow */
.glow{
  position:absolute;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(123,104,238,.12) 0%,transparent 70%);
}
/* the mark */
.mark{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:12px;
}
.mark .ss{
  font-family:'Playfair Display',serif;
  font-weight:700;font-size:280px;
  color:#F0EEFF;letter-spacing:-.08em;
  line-height:.85;
}
.mark .dot{
  width:8px;height:8px;border-radius:50%;
  background:#E8C547;
  box-shadow:0 0 20px rgba(232,197,71,.4),0 0 60px rgba(232,197,71,.15);
}
.mark .wordmark{
  font-family:'Playfair Display',serif;
  font-style:italic;font-weight:500;
  font-size:48px;color:rgba(240,238,255,.35);
  letter-spacing:.15em;text-transform:lowercase;
  margin-top:8px;
}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="ring ring-2"></div>
  <div class="mark">
    <div class="ss">ss</div>
    <div class="dot"></div>
    <div class="wordmark">sign season</div>
  </div>
</body>
</html>
