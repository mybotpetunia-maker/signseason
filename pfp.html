<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{
  width:1024px;height:1024px;
  background:#0D0D1A;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
svg{width:880px;height:880px}
</style>
</head>
<body>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0FF"/>
      <stop offset="40%" stop-color="#E8E0FF"/>
      <stop offset="100%" stop-color="#C8BFEE"/>
    </linearGradient>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moon-shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7B68EE" flood-opacity=".15"/>
    </filter>
  </defs>

  <!-- crescent moon, large and bold -->
  <g filter="url(#moon-shadow)" transform="translate(88,92)">
    <circle cx="0" cy="0" r="68" fill="url(#moon-grad)"/>
    <circle cx="30" cy="-18" r="56" fill="#0D0D1A"/>
  </g>

  <!-- single bold 4-point star, top right -->
  <g filter="url(#glow-lg)" transform="translate(156,42)">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#E8C547" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#E8C547" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- small accent star -->
  <g filter="url(#glow-lg)" transform="translate(148,82)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- tiny dot star -->
  <circle cx="170" cy="62" r="2" fill="#E8C547" opacity=".7"/>
</svg>
<script src="/js/analytics.js" defer></script>
</body>
</html>
