<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{
  width:1024px;height:1024px;
  background:#0D0D1A;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
svg{width:720px;height:720px}
</style>
</head>
<body>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- outer glow -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B68EE" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0D0D1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="gold-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="99" fill="url(#bg-glow)"/>

  <!-- crescent moon -->
  <g transform="translate(100,100)">
    <!-- moon body -->
    <circle cx="0" cy="0" r="52" fill="#F0EEFF" opacity=".95"/>
    <!-- moon shadow (creates crescent) -->
    <circle cx="22" cy="-14" r="44" fill="#0D0D1A"/>
  </g>

  <!-- orbital ring -->
  <ellipse cx="100" cy="100" rx="72" ry="72" fill="none" stroke="#7B68EE" stroke-width=".5" opacity=".25"/>

  <!-- three stars along the orbit -->
  <g filter="url(#gold-glow)">
    <!-- large star top right -->
    <g transform="translate(155,48)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#E8C547" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#E8C547" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- small star bottom left -->
    <g transform="translate(38,148)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#E8C547" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#E8C547" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <!-- tiny star left -->
    <g transform="translate(30,72)">
      <circle cx="0" cy="0" r="1.5" fill="#E8C547"/>
    </g>
  </g>
</svg>
</body>
</html>
